<!-- ═══════════════════════════════════════════════════════════════════
  【文件总览】web/e2e-dashboard.html —— E2E 观测看板（前端单页，无框架、无构建）

  【这个文件是干什么的】
    一个纯静态 HTML 文件：骨架（HTML）+ 主题（CSS 变量）+ 逻辑（原生 JS）全在
    这一个文件里，没有 React/Vue、没有 npm、没有打包。它由
    src/runtime/e2e-dashboard.ts 起的本地 HTTP 服务原样吐给浏览器
    （readFileSync 本文件 → textResponse，零模板渲染），
    用途是【只读地】观察一次 E2E 运行的全过程：
      · 运行队列：磁盘上有几台"运行"，各自什么状态（RUNNING/ACCEPTED/REJECTED/ABORTED）
      · 运行详情：当前状态、阶段时间线、失败原因
      · 事件流：run.jsonl 里的每一条日志（按 #seq 递增）
      · 证据与日志：artifacts/ 和 logs/ 目录里的文件列表 + 内容预览

  【它读哪些接口（后端契约，见 src/runtime/e2e-dashboard.ts 的 handle()）】
    GET /api/runs                                  → RunSummary[]（扫描 root 下所有含 state.json 的目录）
    GET /api/runs/<run_id>                         → { state, events }（state.json + 全量 run.jsonl）
    GET /api/runs/<run_id>/stream?after=<seq>      → SSE 事件流（text/event-stream，增量推送）
    GET /api/runs/<run_id>/artifacts               → ArtifactSummary[]（文件名/大小/修改时间）
    GET /api/runs/<run_id>/artifacts/<name>        → 文件内容（.json 按 JSON 预览）
    GET /api/runs/<run_id>/logs、/logs/<name>      → 日志列表 / 日志内容
    数据的源头是 src/runtime/e2e-log.ts（E2ELogger）：它把每次运行落成
      <root>/<run-id>/{ state.json, run.jsonl, artifacts/, logs/ }

  【数据流一图流】
      E2ELogger 写盘                     后端                    本文件（浏览器）
      state.json  ──────────────────▶ /stream 的 "state" 事件 ──▶ renderOverview/renderTimeline
      run.jsonl   ──────────────────▶ /stream 的 "event" 事件 ─▶ renderEvents（增量、按 seq 去重）
      artifacts/  ──────────────────▶ /api/runs/<id>/artifacts → renderResources → previewResource
      logs/       ──────────────────▶ /api/runs/<id>/logs     → 同上
    刷新策略：SSE 负责"选中运行的实时增量"；/api/runs 列表每 5 秒轮询一次。

  【先修知识】
    ① HTML/CSS 基础 + CSS 自定义属性（CSS 变量、var()）；
    ② 原生 JS：fetch、Promise/async-await、EventSource（SSE）、DOM 的 createElement/replaceChildren；
    ③ 本项目概念：状态机终态（ACCEPTED/REJECTED/ABORTED）、artifact。
  【本文件是教程注释版】
    原文件：web/e2e-dashboard.html（代码与本文件一致，仅多注释）
  ═══════════════════════════════════════════════════════════════════ -->
<!doctype html>
<!-- lang="zh-CN"：页面里有大量中文文案。 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!-- viewport：让它在手机/窄窗口下也能用（本文件底部有三档媒体查询）。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 声明深色配色（浏览器据此把滚动条/表单控件画成深色）。 -->
  <meta name="color-scheme" content="dark">
  <title>E2E Runboard · 运行观测</title>
  <style>
    /* ── 主题：全部颜色/圆角/字体都定义成 :root 上的 CSS 变量 ──────────
       【为什么这么做】整个页面的样式只在这里"发牌"，改主题只动这一处；
       变量命名有规律：-dim 后缀 = 同色系的深底色（用来做"带底色的高亮块"），
       --line = 边框色，--faint/--muted/--text = 三档文字灰度。 */
    :root {
      color-scheme: dark;
      --canvas: #12171d;                 /* ← 页面底色（近黑的蓝灰） */
      --surface: #1a2129;                /* ← 普通卡片 */
      --surface-raised: #202a34;         /* ← 悬停时"抬起来"的卡片 */
      --surface-deep: #0f1419;           /* ← 更深的面板内衬（代码块、事件行） */
      --surface-selected: #272b2e;       /* ← 当前选中的 run 卡片 */
      --line: #34414d;                   /* ← 主边框 */
      --line-soft: #29343f;              /* ← 弱边框 */
      --text: #e8ecef;                   /* ← 正文 */
      --muted: #96a3ad;                  /* ← 次要文字 */
      --faint: #65727c;                  /* ← 最弱文字（序号、时间戳） */
      --accent: #f09a4a;                 /* ← 品牌橙：标题/选中态/正在运行 */
      --accent-strong: #ffb45f;          /* ← 更亮的橙（按钮文字、elapsed） */
      --accent-dim: #573b25;             /* ← 橙的深底色 */
      --blue: #79b7cf;                   /* ← phase / 阶段名专用蓝 */
      --blue-dim: #213d49;
      --ok: #8cc69a;                     /* ← ACCEPTED 的绿 */
      --ok-dim: #203a2a;
      --danger: #ee877f;                 /* ← REJECTED / ABORTED / error 的红 */
      --danger-text: #f5c0bb;
      --danger-dim: #4d292b;
      --warning: #e9c36c;                /* ← 警告黄（见下方 .event-row.warn 的 ⚠️） */
      --warning-dim: #4a3a1f;
      --code-text: #d0dce3;              /* ← 代码/JSON 预览文字 */
      --grid-line: rgba(240, 154, 74, .035);  /* ← 背景网格线（极淡的橙） */
      --spacing-panel: 16px;
      --radius-sm: 4px;
      --radius-md: 8px;
      --mono: "Cascadia Code", "SFMono-Regular", Consolas, monospace;  /* ← 等宽字体 */
      /* ⚠️ 顺带一提：下面 body 用到了 var(--sans)，各处边框阴影用到了 var(--shadow)，
         但这两个变量在 :root 里【没有定义】。CSS 对"取不到值的 var()"的处理是
         让整条声明失效（invalid at computed-value time），等价于没写这条声明 ——
         所以字体回落到浏览器默认值、阴影干脆没有。视觉上无碍，属于本文件的小瑕疵。 */
    }

    /* ── 全局reset 与页面底子 ─────────────────────────────────────── */
    * { box-sizing: border-box; }        /* ← 让 width 里算上 padding/border，布局更好算 */
    html { min-width: 320px; background: var(--canvas); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        /* ↑ 两层背景叠加：先平铺一张 32px 的网格线图（用 linear-gradient 画竖线），
           再垫上底色 —— 这就是页面背后那层淡淡方格纸的来历。 */
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0 / 32px 32px,
        var(--canvas);
      font-family: var(--sans);          /* ⚠️ --sans 未定义（见 :root 末尾的说明） */
      font-size: 14px;
      line-height: 1.45;
    }
    button { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    /* 键盘可达性：Tab 聚焦时画一圈橙色描边。 */
    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--accent-strong);
      outline-offset: 2px;
    }
    .shell { width: min(1640px, 100%); margin: 0 auto; padding: 20px 24px 32px; }

    /* ── 页头 ────────────────────────────────────────────────────── */
    .masthead {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      padding: 10px 0 18px;
      border-bottom: 1px solid var(--line);
    }
    .eyebrow {
      margin: 0 0 5px;
      color: var(--accent);
      font: 700 11px/1.2 var(--mono);
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(24px, 3vw, 36px); letter-spacing: -.035em; line-height: 1.05; }
    .masthead-note { color: var(--muted); text-align: right; max-width: 410px; }
    /* root-path：显示观测根目录。⚠️ 它的内容由 JS 写入 document.body.dataset.root，
       而后端是原样返回这个 HTML 的（没有注入任何 data-root），
       所以实际显示的永远是 fallback 文案"观测根目录已连接"。 */
    .root-path { color: var(--text); font: 12px/1.4 var(--mono); overflow-wrap: anywhere; }

    /* ── 运行队列（run-strip + run-card）──────────────────────────── */
    .run-strip {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);   /* ← 左：标题栏；右：横向滚动的卡片列表 */
      min-height: 128px;
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: rgba(26, 33, 41, .92);
      box-shadow: var(--shadow);                     /* ⚠️ --shadow 未定义 → 这条声明整体失效 */
      overflow: hidden;
    }
    .run-strip-label {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 17px 18px;
      border-right: 1px solid var(--line);
      background: var(--surface-deep);
    }
    .run-strip-label h2 { font-size: 15px; letter-spacing: .01em; }
    .run-count { color: var(--muted); font: 12px var(--mono); }
    .run-list {
      display: flex;
      gap: 9px;
      padding: 13px;
      overflow-x: auto;                  /* ← run 多了就横向滚 */
      align-items: stretch;
    }
    .run-list::-webkit-scrollbar, .scroll::-webkit-scrollbar { height: 8px; width: 8px; }
    .run-list::-webkit-scrollbar-thumb, .scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 99px; }
    .run-card {
      flex: 0 0 232px;                   /* ← 每张卡片固定 232px 宽 */
      display: grid;
      grid-template-columns: 8px 1fr;    /* ← 左：状态色条；右：内容 */
      gap: 10px;
      min-height: 99px;
      padding: 12px 13px 11px 10px;
      color: var(--text);
      text-align: left;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-sm);
      background: var(--surface);
      cursor: pointer;
      transition: border-color 130ms ease-out, background 130ms ease-out, transform 130ms ease-out;
    }
    .run-card:hover { border-color: var(--muted); background: var(--surface-raised); transform: translateY(-1px); }
    /* aria-current="true"：当前选中的 run（JS 里 setAttribute 设置）。 */
    .run-card[aria-current="true"] { border-color: var(--accent); background: var(--surface-selected); }
    .run-card-bar { width: 4px; height: 100%; min-height: 56px; border-radius: 3px; background: var(--faint); }
    /* 左侧色条按状态变色（JS 里拼 `run-card-bar ${statusKey}`）。 */
    .run-card-bar.running { background: var(--accent); }
    .run-card-bar.accepted { background: var(--ok); }
    .run-card-bar.rejected, .run-card-bar.aborted { background: var(--danger); }
    .run-card-bar.unknown { background: var(--faint); }
    .run-card-content { min-width: 0; }
    .run-card-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .run-id { overflow: hidden; color: var(--text); font: 700 12px var(--mono); text-overflow: ellipsis; white-space: nowrap; }
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      width: fit-content;
      padding: 3px 6px;
      border: 1px solid currentColor;    /* ← currentColor = 跟随文字颜色，省得每种状态写一遍边框色 */
      border-radius: 3px;
      font: 700 10px/1 var(--mono);
      letter-spacing: .04em;
      white-space: nowrap;
    }
    .status-chip::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .status-chip.running { color: var(--accent-strong); }
    .status-chip.accepted { color: var(--ok); }
    .status-chip.rejected, .status-chip.aborted { color: var(--danger); }
    .status-chip.unknown { color: var(--muted); }
    .run-card-phase { margin-top: 11px; color: var(--blue); font: 12px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .run-card-time { margin-top: 4px; color: var(--faint); font: 11px var(--mono); }

    /* ── 主体两栏：左（总览+时间线+事件流），右（证据+预览）────────── */
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.34fr) minmax(340px, .66fr);
      gap: 18px;
      margin-top: 18px;
      align-items: start;
    }
    .column { min-width: 0; display: grid; gap: 18px; }
    .panel {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: rgba(26, 33, 41, .93);
      box-shadow: var(--shadow);                     /* ⚠️ --shadow 未定义 → 失效 */
      overflow: hidden;
    }
    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--line-soft);
    }
    .panel-heading h2 { font-size: 15px; letter-spacing: .01em; }
    .panel-heading-note { color: var(--faint); font: 11px var(--mono); }
    .panel-body { padding: 16px; }

    /* ── 选中 run 的总览条（标题 + status/phase/elapsed 三个小格）──── */
    .run-overview { display: grid; grid-template-columns: minmax(0, 1.5fr) repeat(3, minmax(100px, .55fr)); gap: 0; }
    .overview-main { padding: 20px 18px; border-right: 1px solid var(--line-soft); }
    .overview-main h2 { font: 700 clamp(19px, 2.4vw, 28px)/1.1 var(--mono); overflow-wrap: anywhere; }
    .overview-main .last-event { margin-top: 12px; color: var(--muted); }
    .overview-main .last-event strong { color: var(--text); font-weight: 600; }
    .overview-stat { padding: 20px 15px; border-right: 1px solid var(--line-soft); }
    .overview-stat:last-child { border-right: 0; }
    .stat-label { color: var(--faint); font: 11px var(--mono); text-transform: uppercase; letter-spacing: .05em; }
    .stat-value { margin-top: 9px; color: var(--text); font: 600 14px var(--mono); overflow-wrap: anywhere; }
    .stat-value.phase { color: var(--blue); }
    .stat-value.elapsed { color: var(--accent-strong); }

    /* ── 阶段时间线（左侧一条竖轨 + 圆点）────────────────────────── */
    .timeline { display: grid; gap: 0; }
    .phase-row { position: relative; display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 11px; min-height: 50px; }
    .phase-rail { position: relative; display: flex; justify-content: center; }
    .phase-rail::before { content: ""; width: 1px; height: 100%; background: var(--line); }
    /* 首行的轨道从圆点处才开始，末行的轨道到圆点为止 → 视觉上"一条贯穿的线"。 */
    .phase-row:first-child .phase-rail::before { margin-top: 50%; }
    .phase-row:last-child .phase-rail::before { height: 50%; }
    .phase-dot { position: absolute; top: 17px; width: 9px; height: 9px; border: 2px solid var(--surface); border-radius: 50%; background: var(--faint); box-shadow: 0 0 0 1px var(--faint); }
    /* current = 正在进行的阶段（橙、带一圈光晕），done = 已完成（绿）。 */
    .phase-row.current .phase-dot { background: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 0 4px var(--accent-dim); }
    .phase-row.done .phase-dot { background: var(--ok); box-shadow: 0 0 0 1px var(--ok); }
    .phase-copy { min-width: 0; padding: 10px 0; }
    .phase-name { color: var(--text); font: 700 12px var(--mono); }
    .phase-message { margin-top: 3px; color: var(--muted); overflow-wrap: anywhere; }
    .phase-time { padding: 12px 0; color: var(--faint); font: 11px var(--mono); white-space: nowrap; }

    /* ── 事件流（run.jsonl 的一行 = 这里的一行）───────────────────── */
    .event-feed { display: grid; gap: 1px; max-height: 540px; overflow: auto; padding: 1px; }
    .event-row { display: grid; grid-template-columns: 66px 82px minmax(0, 1fr); gap: 10px; padding: 10px 11px; border: 1px solid transparent; background: var(--surface-deep); }
    .event-row:hover { border-color: var(--line); background: var(--surface-raised); }
    /* error 行：左边一条红竖线。 */
    .event-row.error { border-left: 3px solid var(--danger); padding-left: 9px; }
    /* ⚠️⚠️【重要】warn 行（黄色竖线）目前【没有数据来源】：
       它要求事件对象里 level === "warn"，而后端的 E2ELogger.warn()（src/runtime/e2e-log.ts:58）
       全仓库没有任何调用者（死代码），主流水线也没有调用 E2ELogger.output("stderr", …)
       （那是另一个可能产生 level:"warn" 的分支）。所以这条黄色样式从未被渲染过。
       它正是任务 #9「warnings（两侧同失败 → 通过 + warnings）」的前端承接位：
       后端给 CTest/Expectation 对比结果加上 warnings 字段、用 logger.warn() 落一条
       level:"warn" 事件，这里的黄色行就会自动亮起来（CSS 与 JS 都不用改）。 */
    .event-row.warn { border-left: 3px solid var(--warning); padding-left: 9px; }
    .event-seq, .event-phase, .event-type { color: var(--faint); font: 11px/1.4 var(--mono); }
    .event-phase { color: var(--blue); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .event-message { color: var(--text); overflow-wrap: anywhere; white-space: pre-wrap; }
    .event-meta { margin-top: 4px; color: var(--faint); font: 11px var(--mono); }
    .event-empty, .empty-state { padding: 25px 18px; color: var(--muted); text-align: center; }
    .event-empty strong, .empty-state strong { display: block; margin-bottom: 5px; color: var(--text); font-size: 14px; }

    /* ── 右栏：证据（artifact / 日志）列表 ────────────────────────── */
    .resource-list { display: grid; gap: 7px; }
    .resource-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 10px; border: 1px solid var(--line-soft); border-radius: var(--radius-sm); background: var(--surface-deep); }
    .resource-item:hover { border-color: var(--muted); }
    .resource-main { min-width: 0; }
    .resource-name { display: block; overflow: hidden; color: var(--text); font: 12px var(--mono); text-overflow: ellipsis; white-space: nowrap; }
    .resource-meta { display: block; margin-top: 4px; color: var(--faint); font: 11px var(--mono); }
    .resource-button { flex: 0 0 auto; padding: 6px 9px; color: var(--accent-strong); border: 1px solid var(--accent-dim); border-radius: var(--radius-sm); background: transparent; cursor: pointer; }
    .resource-button:hover { border-color: var(--accent); background: var(--accent-dim); }
    .no-run-panel { margin-top: 18px; }

    /* ── 右栏：内容预览（sticky 吸顶 + 标签页按钮 + 代码块）──────────── */
    .detail-view { position: sticky; top: 18px; }
    .detail-toolbar { display: flex; gap: 6px; flex-wrap: wrap; }
    .tab-button { padding: 6px 9px; color: var(--muted); border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent; cursor: pointer; }
    .tab-button:hover { color: var(--text); border-color: var(--line); }
    .tab-button[aria-selected="true"] { color: var(--accent-strong); border-color: var(--accent-dim); background: var(--accent-dim); }
    .detail-content { min-height: 185px; }
    pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .code-view { max-height: 500px; overflow: auto; padding: var(--spacing-panel); border: 1px solid var(--line-soft); border-radius: var(--radius-sm); color: var(--code-text); background: var(--surface-deep); font: 12px/1.6 var(--mono); }
    .selected-label { margin-bottom: 9px; color: var(--blue); font: 11px var(--mono); }
    /* 失败原因条（REJECTED/ABORTED 时显示在总览里）。 */
    .failure-note { margin-top: 12px; padding: 11px 12px; border-left: 3px solid var(--danger); color: var(--danger-text); background: var(--danger-dim); }

    /* ── SSE 连接状态指示（右栏标题右侧那个小圆点）─────────────────── */
    .connection {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font: 11px var(--mono);
    }
    .connection::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
    .connection.live { color: var(--ok); }
    .connection.live::before { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-dim); }
    .connection.retrying { color: var(--warning); }
    .connection.retrying::before { background: var(--warning); }

    /* ── 右下角错误提示条 ────────────────────────────────────────── */
    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 2; max-width: min(420px, calc(100vw - 40px)); padding: 10px 13px; color: var(--text); border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-raised); box-shadow: var(--shadow); }
    .hidden { display: none !important; }   /* ← !important 用来压过其它 display 规则 */

    /* ── 三档响应式：1080 / 820 / 520 px 逐级收窄 ─────────────────── */
    @media (max-width: 1080px) {
      .run-strip { grid-template-columns: 200px minmax(0, 1fr); }
      .workspace { grid-template-columns: minmax(0, 1fr) minmax(300px, .7fr); }
      .run-overview { grid-template-columns: minmax(0, 1.2fr) repeat(3, minmax(80px, .6fr)); }
    }
    @media (max-width: 820px) {
      .shell { padding: 14px 14px 25px; }
      .masthead { align-items: flex-start; flex-direction: column; gap: 11px; }
      .masthead-note { text-align: left; }
      .run-strip { display: block; }
      .run-strip-label { min-height: 0; flex-direction: row; align-items: center; border-right: 0; border-bottom: 1px solid var(--line); }
      .run-list { padding: 11px; }
      .workspace { grid-template-columns: 1fr; }        /* ← 两栏改一栏 */
      .detail-view { position: static; }                /* ← 取消吸顶 */
      .run-overview { grid-template-columns: 1fr 1fr; }
      .overview-main { grid-column: 1 / -1; border-right: 0; border-bottom: 1px solid var(--line-soft); }
      .overview-stat:nth-child(3) { border-right: 0; }
      .overview-stat { padding: 14px; }
    }
    @media (max-width: 520px) {
      .event-row { grid-template-columns: 52px minmax(0, 1fr); gap: 5px 9px; }
      .event-phase, .event-message { grid-column: 2; }
      .event-type { grid-column: 1; grid-row: 2; }
      .event-message { grid-row: 2; }
      .event-meta { grid-column: 2; }
      .phase-row { grid-template-columns: 18px minmax(0, 1fr); }
      .phase-time { grid-column: 2; grid-row: 2; padding-top: 0; }
      .phase-copy { padding-bottom: 2px; }
      .resource-item { align-items: flex-start; flex-direction: column; gap: 8px; }
      .resource-button { width: 100%; }
    }
    /* 尊重系统"减少动态效果"设置：把所有动画/过渡时长压到接近 0。 */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .001ms !important; animation-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <!-- ═══ 页头：标题 + 观测根目录 ═══ -->
    <header class="masthead">
      <div>
        <p class="eyebrow">RUNBOARD / E2E OBSERVABILITY</p>
        <h1>运行观测台</h1>
      </div>
      <div class="masthead-note">
        <span>只读视图 · 自动追踪最新事件</span>
        <!-- id="root-path"：JS 会写 document.body.dataset.root（实际拿不到，见 CSS 里的说明）。 -->
        <div id="root-path" class="root-path">读取观测根目录…</div>
      </div>
    </header>

    <!-- ═══ 区块 1：运行队列（JS 的 renderRunList 往 #run-list 里塞卡片）═══ -->
    <section class="run-strip" aria-labelledby="runs-heading">
      <div class="run-strip-label">
        <h2 id="runs-heading">运行队列</h2>
        <span id="run-count" class="run-count">0 个 run</span>
      </div>
      <!-- aria-live="polite"：内容更新时读屏软件会轻声播报（无障碍）。 -->
      <div id="run-list" class="run-list" aria-live="polite">
        <div class="empty-state"><strong>正在读取</strong>扫描观测根目录…</div>
      </div>
    </section>

    <!-- ═══ 区块 2：一个 run 都没有时的占位面板（默认 hidden）═══ -->
    <div id="no-run" class="panel hidden no-run-panel">
      <div class="empty-state"><strong>还没有可观测的运行</strong>完成一次 E2E 后，包含 state.json 的 run 会出现在这里。</div>
    </div>

    <!-- ═══ 区块 3：主体两栏（默认 hidden，选中 run 后才显示）═══ -->
    <section id="workspace" class="workspace hidden" aria-label="运行详情">
      <div class="column">
        <!-- ── 面板 A：总览（run_id / status / phase / elapsed + 失败原因条 + 时间线）── -->
        <section class="panel" aria-labelledby="overview-heading">
          <div class="run-overview">
            <div class="overview-main">
              <p class="eyebrow">SELECTED RUN</p>
              <h2 id="selected-run">—</h2>
              <p class="last-event">最后事件：<strong id="last-event">—</strong></p>
              <!-- id="failure-note"：REJECTED/ABORTED 时由 renderOverview 填上失败原因。 -->
              <p id="failure-note" class="failure-note hidden" role="note"></p>
            </div>
            <div class="overview-stat">
              <span class="stat-label">status</span>
              <div id="selected-status" class="stat-value">—</div>
            </div>
            <div class="overview-stat">
              <span class="stat-label">phase</span>
              <div id="selected-phase" class="stat-value phase">—</div>
            </div>
            <div class="overview-stat">
              <span class="stat-label">elapsed</span>
              <div id="selected-elapsed" class="stat-value elapsed">—</div>
            </div>
          </div>
          <div class="panel-heading">
            <h2 id="overview-heading">阶段时间线</h2>
            <span id="updated-at" class="panel-heading-note">—</span>
          </div>
          <!-- id="timeline"：renderTimeline 往这里塞阶段行（数据来自 phaseRows()）。 -->
          <div id="timeline" class="panel-body timeline"></div>
        </section>

        <!-- ── 面板 B：事件流（renderEvents 往 #event-feed 塞行，倒序显示）── -->
        <section class="panel" aria-labelledby="events-heading">
          <div class="panel-heading">
            <h2 id="events-heading">事件流</h2>
            <span id="event-count" class="panel-heading-note">0 条</span>
          </div>
          <!-- 注意 class 里有 scroll：对应 CSS 里滚动条样式的那个选择器。 -->
          <div id="event-feed" class="event-feed scroll"></div>
        </section>
      </div>

      <!-- 右栏（aside）：证据列表 + 内容预览 -->
      <aside class="column detail-view">
        <!-- ── 面板 C：证据与日志（Artifacts / 日志 两个标签页 + SSE 连接状态）── -->
        <section class="panel" aria-labelledby="resources-heading">
          <div class="panel-heading">
            <h2 id="resources-heading">证据与日志</h2>
            <span id="connection" class="connection">未连接</span>
          </div>
          <div class="panel-body">
            <!-- role="tablist"/role="tab"：标签页语义；data-tab 是 JS 切换用的键。 -->
            <div class="detail-toolbar" role="tablist" aria-label="证据类型">
              <button class="tab-button" type="button" role="tab" aria-selected="true" data-tab="artifacts">Artifacts</button>
              <button class="tab-button" type="button" role="tab" aria-selected="false" data-tab="logs">日志</button>
            </div>
            <div id="resource-list" class="resource-list resource-list-spaced"></div>
          </div>
        </section>

        <!-- ── 面板 D：内容预览（点"查看"后把 artifact/日志内容铺在这里）── -->
        <section class="panel" aria-labelledby="detail-heading">
          <div class="panel-heading">
            <h2 id="detail-heading">内容预览</h2>
            <span class="panel-heading-note">只读</span>
          </div>
          <div id="detail-content" class="panel-body detail-content">
            <div class="empty-state"><strong>选择一项证据</strong>Artifact 或日志内容会显示在这里。</div>
          </div>
        </section>
      </aside>
    </section>
  </main>
  <!-- toast：请求失败时的提示条（showToast 显示，3.6 秒后自动隐藏）。 -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script>
    /* ── 整个脚本包在一个 IIFE（立即执行函数）里 ──────────────────────
       【语法】(() => { … })();  = 定义一个匿名箭头函数并立刻调用。
       【为什么】让这里的 const/function 全都局部化，不污染全局 window，
       也避免与将来可能同时引入的其它脚本撞名。 */
    (() => {
      // ── state：整页唯一的"可变状态"（相当于一个迷你 store）──────────
      const state = {
        runs: [],               // ← /api/runs 返回的运行摘要列表（RunSummary[]）
        selectedRunId: null,    // ← 当前选中的 run id
        selectedState: null,    // ← 选中 run 的 state.json 内容（E2EState）
        events: [],             // ← 选中 run 的事件数组（按 seq 升序）
        maxSeq: 0,              // ← 已拿到的最大 seq；SSE 用它做断点续传游标
        artifacts: [],          // ← 当前 run 的 artifact 文件列表
        logs: [],               // ← 当前 run 的日志文件列表
        tab: "artifacts",       // ← 右栏当前标签页："artifacts" | "logs"
        source: null,           // ← EventSource 实例（SSE 连接）
        reconnectTimer: null,   // ← SSE 断线重连的定时器
        refreshTimer: null,     // ← /api/runs 轮询的定时器（5 秒）
        toastTimer: null,       // ← toast 自动隐藏的定时器
      };

      // $：按 id 取元素的小工具（getElementById 的缩写）。
      const $ = (id) => document.getElementById(id);
      // 页面上所有会被 JS 反复重写的节点，先一次性取好引用（比每次 $ 快且省事）。
      const runList = $("run-list");
      const workspace = $("workspace");
      const noRun = $("no-run");
      const eventFeed = $("event-feed");
      const timeline = $("timeline");
      const resourceList = $("resource-list");
      const detailContent = $("detail-content");
      const connection = $("connection");

      // 状态 → 人类可读文案（含中英双语，给看板上的 status 芯片用）。
      const statusLabels = {
        running: "RUNNING / 运行中",
        accepted: "ACCEPTED / 已接受",
        rejected: "REJECTED / 已拒绝",
        aborted: "ABORTED / 已中止",
      };

      // ── 小工具函数们 ───────────────────────────────────────────
      // text：把"空/非字符串"兜底成 fallback（"—"），避免页面上出现 undefined。
      function text(value, fallback = "—") {
        return typeof value === "string" && value.length > 0 ? value : fallback;
      }

      // statusKey：把后端给的状态归一到四种 + unknown（颜色条/芯片的 class 都靠它）。
      // 【语法】includes(value) 用于数组成员判断；不在名单里就归为 "unknown"。
      function statusKey(value) {
        return ["running", "accepted", "rejected", "aborted"].includes(value) ? value : "unknown";
      }

      // formatDuration：毫秒 → 人话。⚠️ 入参单位是毫秒（后端 elapsed_ms）。
      //   < 1000ms → "xxx ms"；< 60s → "x.x s"；再往上 → "8m 01s"。
      function formatDuration(ms) {
        if (!Number.isFinite(ms)) return "—";
        if (ms < 1000) return `${Math.max(0, Math.round(ms))} ms`;
        const seconds = ms / 1000;
        if (seconds < 60) return `${seconds.toFixed(seconds < 10 ? 1 : 0)} s`;
        const minutes = Math.floor(seconds / 60);
        return `${minutes}m ${Math.floor(seconds % 60).toString().padStart(2, "0")}s`;
      }

      // formatTime：ISO 时间字符串 → 本地时区的 "zh-CN" 写法；解析失败就原样显示。
      function formatTime(value) {
        if (!value) return "—";
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? value : date.toLocaleString("zh-CN", { hour12: false });
      }

      // formatBytes：字节数 → B / KB / MB。
      function formatBytes(size) {
        if (!Number.isFinite(size)) return "未知大小";
        if (size < 1024) return `${size} B`;
        if (size < 1024 * 1024) return `${(size / 1024).toFixed(1)} KB`;
        return `${(size / (1024 * 1024)).toFixed(1)} MB`;
      }

      // createElement：造元素的统一入口。
      // ⚠️【安全关键】它只给 textContent 赋值，从不碰 innerHTML —— 所以
      //    run_id / 日志内容 / artifact JSON 里就算藏了 <script> 也只会被当纯文本显示，
      //    这个看板不存在 XSS 注入面。
      function createElement(tag, className, content) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (content !== undefined) node.textContent = content;
        return node;
      }

      // showToast：右下角弹一条错误提示，3.6 秒后自动消失。
      // 先 clearTimeout 再 setTimeout：连续报错时只保留最后一次的 3.6 秒计时。
      function showToast(message) {
        $("toast").textContent = message;
        $("toast").classList.remove("hidden");
        clearTimeout(state.toastTimer);
        state.toastTimer = setTimeout(() => $("toast").classList.add("hidden"), 3600);
      }

      // ── requestJson：所有 GET 接口的统一封装 ─────────────────────
      // 【作用】fetch + 禁用缓存 + 统一错误处理。
      // 【语法】async/await：await 会"等 Promise 拿到结果再继续往下走"，
      //        函数标了 async 才能在里面用 await，且它自己返回一个 Promise。
      // 【细节】response.json() 失败时用 .catch(() => ({})) 兜成空对象，
      //        这样 502/HTML 错误页也不会把页面搞挂；!response.ok 时抛出
      //        后端给的 error 字段（e2e-dashboard.ts 的 DashboardHttpError 会带中文原因）。
      async function requestJson(url) {
        const response = await fetch(url, { cache: "no-store" });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error || `请求失败（${response.status}）`);
        return payload;
      }

      // ── refreshResources：拉取当前 run 的 artifact + 日志两个列表 ──
      // 【语法】Promise.all：两个请求【并发】发出，全部完成后一起继续（数组按序取）。
      // 【细节】encodeURIComponent 把 run_id 里的特殊字符转义成 URL 安全形式。
      // 【竞态保护】如果 await 期间用户切到了别的 run（selectedRunId 变了），
      //        就直接丢弃这次结果 —— 这是单页应用里最常见的一类 bug 防御。
      async function refreshResources(runId) {
        const resources = await Promise.all([
          requestJson(`/api/runs/${encodeURIComponent(runId)}/artifacts`),
          requestJson(`/api/runs/${encodeURIComponent(runId)}/logs`),
        ]);
        if (state.selectedRunId !== runId) return;
        state.artifacts = Array.isArray(resources[0]) ? resources[0] : [];
        state.logs = Array.isArray(resources[1]) ? resources[1] : [];
        renderResources();
      }

      // ── renderRunList：把 state.runs 画成顶部那排卡片 ─────────────
      // 【模式】先 replaceChildren() 清空、再逐个 append —— 本文件所有 render* 都是
      //        这个"全量重画"模式（数据量小，简单可靠）。
      function renderRunList() {
        runList.replaceChildren();
        $("run-count").textContent = `${state.runs.length} 个 run`;
        if (state.runs.length === 0) {
          runList.append(createElement("div", "empty-state", "等待新的 E2E 运行…"));
          return;
        }
        for (const run of state.runs) {
          const key = statusKey(run.status);
          // 卡片本身就是 <button>：可以点、可以 Tab 聚焦（无障碍）。
          const card = createElement("button", "run-card");
          card.type = "button";
          card.setAttribute("aria-current", String(run.run_id === state.selectedRunId));
          card.setAttribute("aria-label", `查看 ${run.run_id}`);
          const bar = createElement("span", `run-card-bar ${key}`);      // ← 左侧状态色条
          const content = createElement("span", "run-card-content");
          const top = createElement("span", "run-card-top");
          top.append(createElement("span", "run-id", run.run_id));
          top.append(createElement("span", `status-chip ${key}`, statusLabels[key] || "UNKNOWN"));
          content.append(top);
          content.append(createElement("span", "run-card-phase", text(run.phase, "未进入阶段")));
          content.append(createElement("span", "run-card-time", `${formatDuration(run.elapsed_ms)} · ${formatTime(run.updated_at)}`));
          card.append(bar, content);
          // 点击卡片 → 切换到这个 run。
          card.addEventListener("click", () => selectRun(run.run_id));
          runList.append(card);
        }
      }

      // ── renderOverview：把 state.json 画到总览区 ──────────────────
      // ⚠️【任务 #6A 的承接位】"失败原因"是这样来的：
      //    把事件数组倒序扫一遍，找第一条 level === "error" 或 event === "decision"
      //    的事件，取它的 message 显示成一行字。这是"一句话 reason"级别的展示 ——
      //    等后端加了结构化 failure-report（added/removed failures、
      //    expectation mismatch 的两侧值），这里就该升级成一个失败归因面板。
      function renderOverview() {
        const run = state.selectedState;
        if (!run) return;
        const key = statusKey(run.status);
        $("selected-run").textContent = text(run.run_id, state.selectedRunId || "—");
        $("selected-status").replaceChildren(createElement("span", `status-chip ${key}`, statusLabels[key] || "UNKNOWN / 未知"));
        $("selected-phase").textContent = text(run.phase, "未进入阶段");
        $("selected-elapsed").textContent = formatDuration(Number(run.elapsed_ms));
        $("last-event").textContent = text(run.last_event, "暂无事件");
        $("updated-at").textContent = `更新于 ${formatTime(run.updated_at)}`;
        const failureNote = $("failure-note");
        // slice().reverse()：复制一份再倒序，避免改动 state.events 本身的顺序。
        const failureEvent = state.events.slice().reverse().find((event) => event.level === "error" || event.event === "decision");
        if (key === "rejected" || key === "aborted") {
          failureNote.textContent = `失败原因：${text(failureEvent && failureEvent.message, text(run.last_event, "未提供原因"))}`;
          failureNote.classList.remove("hidden");
        } else {
          failureNote.textContent = "";
          failureNote.classList.add("hidden");
        }
      }

      // ── phaseRows：从事件流里"折叠"出阶段时间线的数据 ─────────────
      // 【作用】run.jsonl 里会有很多条 event === "phase" 的事件（同名阶段会出现多次，
      //        比如"阶段开始/阶段结束"），这里用 Map 按 phase 名去重聚合成一行：
      //        首次出现定顺序（firstSeq），后续出现刷新 message 与耗时（lastSeq/elapsed）。
      // 【语法】new Map()：键值对集合，这里当"名字 → 行对象"的字典用，
      //        既能 O(1) 查重，又能保持插入顺序。
      function phaseRows() {
        const rows = [];
        const seen = new Map();
        for (const event of state.events) {
          if (event.event !== "phase") continue;         // ← 只关心 phase 事件
          const name = text(event.phase, "UNKNOWN");
          const existing = seen.get(name);
          if (existing) {
            existing.message = text(event.message, existing.message);
            existing.lastSeq = event.seq;
            existing.elapsed = event.elapsed_ms;
          } else {
            const row = { name, message: text(event.message, "阶段开始"), firstSeq: event.seq, lastSeq: event.seq, elapsed: event.elapsed_ms };
            seen.set(name, row);
            rows.push(row);
          }
        }
        // 一个 phase 事件都还没有时（刚切过来），先用 state.json 里的 phase 兜底画一行。
        if (rows.length === 0 && state.selectedState) {
          rows.push({ name: text(state.selectedState.phase, "INIT"), message: "当前状态尚未写入阶段事件", firstSeq: 0, lastSeq: 0, elapsed: 0 });
        }
        return rows;
      }

      // ── renderTimeline：把 phaseRows() 画成带圆点的竖向时间线 ──────
      // 与 state.json 里的 phase 同名的行标成 current（橙点），其余标成 done（绿点）。
      function renderTimeline() {
        timeline.replaceChildren();
        const rows = phaseRows();
        if (rows.length === 0) {
          timeline.append(createElement("div", "event-empty", "暂无阶段事件"));
          return;
        }
        const current = text(state.selectedState && state.selectedState.phase, "");
        rows.forEach((row) => {
          const item = createElement("div", `phase-row ${row.name === current ? "current" : "done"}`);
          const rail = createElement("span", "phase-rail");
          rail.append(createElement("span", "phase-dot"));
          const copy = createElement("div", "phase-copy");
          copy.append(createElement("div", "phase-name", row.name));
          copy.append(createElement("div", "phase-message", row.message));
          const time = createElement("div", "phase-time", formatDuration(Number(row.elapsed)));
          item.append(rail, copy, time);
          timeline.append(item);
        });
      }

      // ── renderEvents：把事件流画成列表（新事件在上面）──────────────
      // 【数据流】SSE 的 "event" 消息 → state.events.push → 这里全量重画。
      // 【语法】["error","warn"].includes(event.level) ? event.level : "info"：
      //        level 只有三种合法值，取不到就当 info —— 这个 level 同时被拼进
      //        class 名（event-row error / warn），黄色行就是这里染出来的。
      //        ⚠️ 目前后端从不产生 level:"warn"（见 CSS 里 .event-row.warn 的说明）。
      function renderEvents() {
        eventFeed.replaceChildren();
        // 标题右侧显示条数和游标（游标 = 断线重连后从哪条继续）。
        $("event-count").textContent = `${state.events.length} 条 · 游标 ${state.maxSeq}`;
        if (state.events.length === 0) {
          eventFeed.append(createElement("div", "event-empty", "等待事件写入 run.jsonl…"));
          return;
        }
        for (const event of state.events.slice().reverse()) {   // ← 倒序：最新在最上面
          const level = ["error", "warn"].includes(event.level) ? event.level : "info";
          const row = createElement("article", `event-row ${level}`);
          const sequence = createElement("span", "event-seq", `#${event.seq}`);
          const phase = createElement("span", "event-phase", text(event.phase, "—"));
          const body = createElement("div", "event-message");
          body.append(createElement("div", "event-type", text(event.event, "event")));
          body.append(createElement("div", "", text(event.message, "无消息")));
          body.append(createElement("div", "event-meta", `${formatDuration(Number(event.elapsed_ms))} · ${formatTime(event.ts)}`));
          // details 字段存在且是对象时，包一个可折叠的 <details>/<summary>：
          // 【语法】details 是浏览器原生的折叠组件，展开/收起不用写任何 JS。
          // 【内容】details 里是这条事件的附加字段（命令、artifact 路径等），
          //        用 JSON.stringify(x, null, 2) 美化成 2 空格缩进再显示。
          if (event.details && typeof event.details === "object") {
            const details = createElement("details", "event-meta");
            details.append(createElement("summary", "", "查看 details"));
            details.append(createElement("pre", "", JSON.stringify(event.details, null, 2)));
            body.append(details);
          }
          row.append(sequence, phase, body);
          eventFeed.append(row);
        }
      }

      // ── renderResources：按当前标签页画 artifact 或日志列表 ────────
      function renderResources() {
        resourceList.replaceChildren();
        const items = state.tab === "artifacts" ? state.artifacts : state.logs;
        if (items.length === 0) {
          resourceList.append(createElement("div", "event-empty", state.tab === "artifacts" ? "该 run 还没有 Artifact" : "该 run 还没有日志文件"));
          return;
        }
        for (const item of items) {
          const row = createElement("div", "resource-item");
          const main = createElement("div", "resource-main");
          main.append(createElement("span", "resource-name", item.name));
          main.append(createElement("span", "resource-meta", `${formatBytes(item.size)} · ${formatTime(item.modified_at)}`));
          const button = createElement("button", "resource-button", "查看");
          button.type = "button";
          // 点击"查看" → 拉取该文件内容铺到下面的预览区。
          button.addEventListener("click", () => previewResource(state.tab, item.name));
          row.append(main, button);
          resourceList.append(row);
        }
      }

      // ── renderDetail：把内容铺进预览面板 ─────────────────────────
      // isJson = true 时先把对象美化（2 空格缩进）再显示，否则原样显示文本。
      function renderDetail(label, value, isJson) {
        detailContent.replaceChildren();
        detailContent.append(createElement("div", "selected-label", label));
        const pre = createElement("pre", "code-view");
        pre.textContent = isJson ? JSON.stringify(value, null, 2) : String(value);
        detailContent.append(pre);
      }

      // ── previewResource：拉一个 artifact / 日志文件的内容来预览 ────
      // 【细节】这次故意不用 requestJson（因为响应可能是纯文本），而是直接 fetch
      //        + response.text()；再看 Content-Type 判断要不要 JSON.parse 美化。
      //        ⚠️ JSON.parse 失败会被吞掉、按纯文本展示（catch 里的注释是原文件自带的）。
      async function previewResource(kind, name) {
        if (!state.selectedRunId) return;
        const path = `/api/runs/${encodeURIComponent(state.selectedRunId)}/${kind}/${encodeURIComponent(name)}`;
        try {
          const response = await fetch(path, { cache: "no-store" });
          const content = await response.text();
          if (!response.ok) throw new Error("文件读取失败");
          let value = content;
          let isJson = false;
          if (response.headers.get("content-type")?.includes("application/json")) {
            try { value = JSON.parse(content); isJson = true; } catch { /* show malformed JSON as text */ }
          }
          renderDetail(`${kind === "artifacts" ? "ARTIFACT" : "LOG"} / ${name}`, value, isJson);
        } catch (error) {
          showToast(error instanceof Error ? error.message : "文件读取失败");
        }
      }

      // ── SSE 连接的三个函数 ────────────────────────────────────
      // setConnection：改右栏标题旁那颗状态灯（未连接 / 连接中 / 已连接）。
      function setConnection(kind, label) {
        connection.className = `connection ${kind || ""}`;
        connection.textContent = label;
      }

      // closeStream：关掉 SSE + 取消重连定时器 + 熄灯。
      // 在"切 run / 页面卸载 / 没有任何 run"时都会被调用。
      function closeStream() {
        if (state.source) state.source.close();
        state.source = null;
        if (state.reconnectTimer) clearTimeout(state.reconnectTimer);
        state.reconnectTimer = null;
        setConnection("", "未连接");
      }

      // ── connectStream：订阅选中 run 的 SSE 事件流 ────────────────
      // 【SSE 是什么】Server-Sent Events：HTTP 长连接，服务器可以持续往里推消息；
      // 浏览器端用 EventSource 接收，按 event: 名字分发到不同监听器。
      // 后端（e2e-dashboard.ts 的 stream()）每 800ms 扫一次 run.jsonl 的增量，
      // 有新行就发 "event" 消息；state.json 内容变了就发 "state" 消息；每 15 秒发一次注释帧保活。
      // 【断点续传】把当前 maxSeq 作为 ?after= 传过去，服务器只发比它新的 ——
      //        这样"先拉全量、再增量"不会重复也不会漏。
      function connectStream() {
        closeStream();
        if (!state.selectedRunId) return;
        const query = state.maxSeq > 0 ? `?after=${state.maxSeq}` : "";
        const source = new EventSource(`/api/runs/${encodeURIComponent(state.selectedRunId)}/stream${query}`);
        state.source = source;
        setConnection("retrying", "连接中");
        // "state" 消息：state.json 变了 → 重画总览/时间线/run 列表，并刷新证据列表。
        source.addEventListener("state", (event) => {
          try {
            state.selectedState = JSON.parse(event.data);
            renderOverview();
            renderTimeline();
            renderRunList();
            void refreshResources(state.selectedRunId || "").catch((error) => showToast(error instanceof Error ? error.message : "证据列表刷新失败"));
          } catch { showToast("状态数据格式异常"); }
        });
        // "event" 消息：run.jsonl 多了一行 → 追加、重画事件流与时间线。
        source.addEventListener("event", (event) => {
          try {
            const next = JSON.parse(event.data);
            // 去重 + 保序：seq 不合法或没超过游标就直接丢弃。
            if (!Number.isFinite(next.seq) || next.seq <= state.maxSeq) return;
            state.events.push(next);
            state.maxSeq = next.seq;
            renderEvents();
            renderTimeline();
            // 出现新 artifact 或最终裁决时，顺手刷新右栏的证据列表（可能有新文件）。
            if (next.event === "artifact" || next.event === "decision") {
              void refreshResources(state.selectedRunId || "").catch((error) => showToast(error instanceof Error ? error.message : "证据列表刷新失败"));
            }
          } catch { showToast("事件数据格式异常"); }
        });
        // 断线：1.8 秒后重连（EventSource 本身也会自动重连，这里显式控制一遍，
        //        顺便把 ?after= 游标带上，避免重连后重复收旧事件）。
        source.addEventListener("error", () => {
          setConnection("retrying", "等待重连");
          source.close();
          state.source = null;
          if (state.reconnectTimer) clearTimeout(state.reconnectTimer);
          state.reconnectTimer = setTimeout(connectStream, 1800);
        });
        source.onopen = () => setConnection("live", "SSE 已连接");
      }

      // ── refreshRuns：拉运行列表（也是整个页面的入口）───────────────
      // 【流程】GET /api/runs → 更新 state.runs → 重画卡片 →
      //        一个 run 都没有 → 藏详情、显示占位面板、断开 SSE；
      //        当前选中的 run 已消失 → 自动切到列表第一个（updated_at 最新的那个）。
      async function refreshRuns() {
        try {
          const payload = await requestJson("/api/runs");
          state.runs = Array.isArray(payload) ? payload : [];
          $("root-path").textContent = document.body.dataset.root || "观测根目录已连接";
          renderRunList();
          if (state.runs.length === 0) {
            state.selectedRunId = null;
            state.selectedState = null;
            closeStream();
            workspace.classList.add("hidden");
            noRun.classList.remove("hidden");
            return;
          }
          noRun.classList.add("hidden");
          const stillExists = state.runs.some((run) => run.run_id === state.selectedRunId);
          if (!stillExists) await selectRun(state.runs[0].run_id);
        } catch (error) {
          runList.replaceChildren(createElement("div", "empty-state", "无法读取运行列表"));
          showToast(error instanceof Error ? error.message : "运行列表读取失败");
        }
      }

      // ── selectRun：切换到某个 run（点卡片 / 自动选中都会走到这里）───
      // 【流程】先清空本地状态（events/maxSeq 归零）→ 拉全量 { state, events } →
      //        按 seq 排序、记下最大 seq → 刷新证据列表 → 全量重画四个区域 →
      //        最后 connectStream() 建立增量推送。
      // 【竞态保护】两处 `state.selectedRunId !== runId` 检查：await 期间用户又点了
      //        别的 run 的话，过期响应直接丢弃。
      async function selectRun(runId) {
        if (state.selectedRunId === runId && state.selectedState) return;   // ← 重复点击直接忽略
        closeStream();
        state.selectedRunId = runId;
        state.selectedState = null;
        state.events = [];
        state.maxSeq = 0;
        workspace.classList.remove("hidden");
        noRun.classList.add("hidden");
        renderRunList();
        $("selected-run").textContent = runId;
        $("selected-status").textContent = "读取中…";
        eventFeed.replaceChildren(createElement("div", "event-empty", "正在读取事件…"));
        try {
          const detail = await requestJson(`/api/runs/${encodeURIComponent(runId)}`);
          if (state.selectedRunId !== runId) return;
          state.selectedState = detail.state || {};
          state.events = Array.isArray(detail.events) ? detail.events : [];
          state.events.sort((a, b) => a.seq - b.seq);
          // 【语法】可选链 + 数组 at(-1)：取最后一个元素的 seq；数组为空则取 0。
          //        这个值就是之后 SSE 的 ?after= 游标。
          state.maxSeq = state.events.at(-1)?.seq || 0;
          await refreshResources(runId);
          if (state.selectedRunId !== runId) return;
          renderOverview();
          renderTimeline();
          renderEvents();
          renderResources();
          connectStream();
        } catch (error) {
          showToast(error instanceof Error ? error.message : "run 读取失败");
        }
      }

      // ── 右栏标签页切换（Artifacts / 日志）─────────────────────────
      // 【语法】querySelectorAll("[data-tab]")：选中所有带 data-tab 属性的元素。
      //        切换 = 改 state.tab + 调整 aria-selected（驱动高亮样式）+ 重画列表。
      document.querySelectorAll("[data-tab]").forEach((button) => {
        button.addEventListener("click", () => {
          state.tab = button.dataset.tab === "logs" ? "logs" : "artifacts";
          document.querySelectorAll("[data-tab]").forEach((other) => other.setAttribute("aria-selected", String(other === button)));
          renderResources();
        });
      });

      // ── 启动：首刷 + 每 5 秒轮询列表 + 关页时断开 SSE ──────────────
      // 注意分工：SSE 只覆盖"选中 run"的实时增量；列表本身（新增/消失的 run）
      // 靠这个 5 秒轮询。beforeunload 里主动 closeStream，避免留下半开的连接。
      refreshRuns();
      state.refreshTimer = setInterval(refreshRuns, 5000);
      window.addEventListener("beforeunload", closeStream);
    })();
  </script>
</body>
</html>
