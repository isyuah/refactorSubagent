name: Engineering and offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc cmake ninja-build
      - name: Install Windows build tools
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Add native MinGW tools to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - run: bun install --frozen-lockfile
      - name: Typecheck, engineering tests and runner self-test
        run: bun run check
      - name: Applicable offline cases with strict environment checks
        run: bun run test:offline --out "${{ runner.temp }}/rfr-o"
      - name: Retain offline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-${{ matrix.os }}
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/rfr-o/summary.json
            ${{ runner.temp }}/rfr-o/*/*.json
            ${{ runner.temp }}/rfr-o/*/prepare*.txt
            ${{ runner.temp }}/rfr-o/*/session/.refactor/e2e/*/artifacts/*.json
            ${{ runner.temp }}/rfr-o/*/session/.refactor/e2e/*/*.jsonl
